  - variant_id: "101_turnaround"
    title: 三面図用
    description: 固定外見と普段着を確認するための資料用バリアント。
    danbooru_tags: [character_sheet, front_view, side_view, back_view, simple_background]
    combines_with: "001_normal"
  - variant_id: "102_signature_pose"
    title: 決めポーズ用
