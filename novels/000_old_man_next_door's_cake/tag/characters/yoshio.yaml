  closeup_rules: 笑顔でも目の奥の寂しさと年齢相応の表情を残す。
prompt_variants:
  - variant_id: "000_base"
    title: 固定外見
    description: 高齢男性としての固定外見。衣装・姿勢なし。
    danbooru_tags: [1man, elderly_man, short_white_hair, narrow_eyes]
  - variant_id: "001_normal"
    title: 晩秋の普段着
    description: コーポ藤見で暮らす義雄の通常衣装。
    danbooru_tags: [beige_cardigan, navy_trousers, casual_clothes]
    caption: Yoshio Mishima in his everyday late-autumn apartment clothes.
    translation: 晩秋の普段着を着た三島義雄。
  - variant_id: "100_intro"
    title: 紹介用
    description: 読者向け人物紹介に使う、親しみのある立ち姿。
    danbooru_tags: [standing, gentle_smile, simple_background]
