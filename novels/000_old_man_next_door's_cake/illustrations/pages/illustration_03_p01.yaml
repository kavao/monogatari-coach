      perspective: 茜の肩越しの近い視点
      perspective_en: intimate over-the-shoulder viewpoint from near Akane
    camera:
      angle: 目線の高さ
      angle_en: eye level
      shot_size: medium shot
      shot_size_en: medium shot
    lighting:
      direction: 天井の蛍光灯と窓からの暗い反射
      direction_en: cool fluorescent ceiling light with faint darkness reflected from the window
      quality: 白く静かな光、肌と生クリームだけに微かな温かさ
