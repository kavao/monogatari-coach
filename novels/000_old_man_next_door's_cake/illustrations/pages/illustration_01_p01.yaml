schema_version: "1.0"
meta:
  intent: illustration
  reading_order: right_to_left
  aspect_ratio: "3:4"
  page_count: 1
  source_text: "_novel_text/novel_text01.md"
  source_anchor: ch01-002
  illustration_type: insert
render_instruction:
  task: このYAMLを、第一章の本文中に置く文字なしの一枚挿絵として扱う。
  prompt_header: 晩秋の夕方、古いアパートの薄暗い二階廊下で、若い女性が座り込む隣人を見つける静かな場面を描く。
  panel_policy: panels[] は構図セル1件のみ。枠線・分割画面なしの一枚絵として描く。
  character_policy: 茜は黒髪とチャコールグレーのパーカー、義雄は白髪とベージュのカーディガンを必ず維持する。
  text_policy: 画像内に会話、部屋番号、看板、効果音などの文字を入れない。
  output_policy: 本文を補う縦長の挿絵として出力する。
  user_directives:
    page_notes: ["高齢者の転倒を大げさな事故にせず、躊躇と気遣いが始まる静けさを描く。"]
    defaults:
      required_prompt_tags: [contemporary_Japan, aging_apartment, late_autumn]
      omit_prompt_tags: [text, logo, watermark, speech_bubble, comic_panel]
manga:
  genre_tags: [contemporary literary fiction illustration]
  visual_tags: [painterly illustration, cinematic quietness, detailed environment]
  line_art: soft detailed painterly linework
  panel_layout: "枠線なし・一枚絵・セル境界なし。廊下の奥行きを使う。"
  text_policy: No text in the image.
scene:
  location: コーポ藤見二階の廊下
  location_en: dim second-floor corridor of an aging wooden Tokyo suburban apartment, narrow walkway, creaking floorboards, one fluorescent light, rusted metal stairs nearby
  time_of_day: 十一月末の夕暮れ
  time_of_day_en: late November dusk
  weather: 冷えた屋外廊下
  weather_en: cold outdoor corridor at dusk
  era: contemporary Japan
  background_notes: クリーム色の古い壁、暗い廊下、隣室の前に座り込む義雄。
  background_notes_en: faded cream walls, dim corridor, an elderly neighbor seated near his apartment door, a narrow path leading into darkness
character_ids: [akane, yoshio]
character_snapshots:
  - character_id: akane
    name: 中瀬茜
    name_en: Akane Nakase
    selected_variant_id: "001_normal"
    appearance_summary: 18-year-old adult Japanese woman with shoulder-length natural black hair, slim build, neat posture, reserved expression
    costume_summary: old charcoal gray hoodie, dark blue jeans, simple shoulder bag
    fixed_tags: [adult_woman, black_hair, shoulder_length_hair]
    variant_tags: [charcoal_gray_hoodie, dark_blue_jeans]
    do_not_change: [Do not portray Akane as a child or change her black hair and casual clothing.]
  - character_id: yoshio
    name: 三島義雄
    name_en: Yoshio Mishima
    selected_variant_id: "001_normal"
    appearance_summary: 74-year-old Japanese man with short white hair, narrow eyes, medium build, gentle but fragile presence
    costume_summary: thin beige cardigan and navy trousers
    fixed_tags: [elderly_man, short_white_hair, narrow_eyes]
    variant_tags: [beige_cardigan, navy_trousers]
    do_not_change: [Do not portray Yoshio as young or change his white hair and cardigan.]
background_concepts:
  - concept_id: apartment_corridor_dusk
    title: コーポ藤見の廊下
    description: 窓がなく薄暗い、築年数の経ったアパートの二階廊下。
    prompt: Empty dim second-floor corridor of an aging Tokyo suburban apartment at late autumn dusk, faded cream walls, fluorescent light, creaking wooden floorboards, rusted stair rail, literary realism, no people
    negative_tags: [people, text, logo]
    provider_hint: openai
    usage: 第1章の導入空間の基準。
panels:
  - panel_id: 1
    summary: 帰宅した茜が薄暗い廊下で座り込む義雄を見つけ、思わず足を止める。
    summary_en: Returning home, Akane stops in a dim corridor when she finds Yoshio seated on the cold floor outside his apartment.
    summary_en_source: 帰宅した茜が薄暗い廊下で座り込む義雄を見つけ、思わず足を止める。
    step2_summary: A young woman in a charcoal hoodie pauses in a dim aging apartment corridor before an elderly neighbor seated on the floor.
    subjects:
      - character_id: akane
        variant_id: "001_normal"
        description: 廊下の手前で立ち止まる茜
        description_en: Akane stopping at the near end of the corridor
        pose_action: バッグの持ち手を握り、義雄へ視線を向ける
        pose_action_en: holding her bag strap while looking toward Yoshio
        position: foreground
        expression: 驚きとためらい
        expression_en: surprise mixed with hesitation
      - character_id: yoshio
        variant_id: "001_normal"
        description: 隣室の前に座り込む義雄
        description_en: Yoshio seated outside the neighboring apartment door
        pose_action: 壁に背を預け、片足をそっと伸ばしている
        pose_action_en: leaning against the wall with one leg carefully extended
        position: midground
        expression: 困ったような苦笑い
        expression_en: an embarrassed, weary half-smile
    composition:
      framing: 廊下の奥行きを見せる縦長ワイド
      framing_en: portrait wide shot emphasizing the corridor depth
      layout: 茜を手前左、義雄を奥右に置く対角線構図
      layout_en: Akane in the near left foreground and Yoshio in the far right midground along a diagonal corridor line
      focus: 二人の間にある冷えた廊下の距離
      focus_en: the cold distance of the corridor between the two neighbors
      perspective: 茜の立ち位置に近い視点
      perspective_en: viewpoint close to Akane's standing position
    camera:
      angle: 目線の高さ
      angle_en: eye level
      shot_size: wide shot
      shot_size_en: wide shot
    lighting:
      direction: 廊下中ほどの蛍光灯
      direction_en: a single fluorescent light halfway down the corridor
      quality: 夕暮れの青さと冷たい白い室内光
      quality_en: blue dusk shadows mixed with cold white fluorescent light
      mood_effect: 出会いの緊張と小さな気遣い
      mood_effect_en: hesitant encounter and a first spark of concern
    text: {}
    mood_atmosphere: [冷えた夕暮れ, ためらい, 静かな出会い]
    mood_atmosphere_en: [cold dusk, hesitation, quiet encounter]
    prompt_tags: [dim_corridor, seated_elderly_man, young_woman_with_bag, fluorescent_light]
    translation: 薄暗い廊下で茜が義雄を見つける第一章の挿絵。
color_palette:
  mode: full_color
  colors: [faded_cream, charcoal_gray, navy, cold_white, dusk_blue]
technical:
