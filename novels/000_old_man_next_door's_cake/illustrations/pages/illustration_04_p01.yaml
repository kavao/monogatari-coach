schema_version: "1.0"
meta:
  intent: illustration
  reading_order: right_to_left
  aspect_ratio: "3:4"
  page_count: 1
  source_text: "_novel_text/novel_text04.md"
  source_anchor: ch04-002
  illustration_type: insert
render_instruction:
  task: このYAMLを、第四章の温かな着地を描く文字なしの一枚挿絵として扱う。
  prompt_header: 不格好なケーキを前に、年齢の異なる二人の隣人が狭い台所で一緒に食べる、静かで温かな場面を描く。
  panel_policy: panels[] は構図セル1件のみ。枠線・分割画面なしの一枚絵として描く。
  character_policy: 茜は黒髪・チャコールグレーのパーカー、義雄は白髪・ベージュのカーディガンを守る。
  text_policy: 画像内に台詞、文字、看板、効果音を入れない。
  output_policy: 二人の距離が自然に縮まったことを、ケーキを分ける姿勢で見せる。
  user_directives:
    page_notes: ["茜が次の年を口にする会話は文字にせず、食卓の温度だけで未来の気配を残す。"]
    defaults:
      required_prompt_tags: [contemporary_Japan, homemade_cake, quiet_warmth]
      omit_prompt_tags: [text, logo, watermark, speech_bubble, comic_panel]
manga:
  genre_tags: [contemporary literary fiction illustration]
  visual_tags: [painterly illustration, warm intimate scene, subtle realism]
  line_art: soft detailed painterly linework
  panel_layout: "枠線なし・一枚絵・セル境界なし。テーブルと床の高さの違いで二人の親密さを表す。"
  text_policy: No text in the image.
scene:
  location: コーポ藤見202号室の台所と和室の境目
  location_en: small kitchen and tatami room threshold in an aging Tokyo suburban apartment, low folding table, one chair, modest evening interior
  time_of_day: 晩秋の夜
  time_of_day_en: late autumn night
  weather: 室内
  weather_en: quiet indoor night
  era: contemporary Japan
  background_notes: 皿に分けられた不格好なケーキ、白いクリーム、二つの苺ジャムの赤い点、古い本棚。
  background_notes_en: two plates of imperfect homemade sponge cake with white cream and small red strawberry jam accents, old bookshelf, modest apartment interior
character_ids: [akane, yoshio]
