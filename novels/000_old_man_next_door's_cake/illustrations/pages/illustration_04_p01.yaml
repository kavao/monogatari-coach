background_concepts:
  - concept_id: cake_table_night
    title: ケーキを囲む小さな食卓
    description: 椅子一脚と折りたたみテーブルだけがある、生活感のある夜の部屋。
    prompt: Modest low folding table in an aging Tokyo apartment at late autumn night, two small plates of imperfect homemade sponge cake with white cream and strawberry jam, one chair, old bookshelf, warm quiet interior, no people
    negative_tags: [people, text, logo]
    provider_hint: openai
    usage: 第4章の食卓とケーキの基準。
panels:
