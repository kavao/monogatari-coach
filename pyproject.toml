[project]
name = "monocri"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]

[tool.pyright]
# PyYAML は実行時に問題なく import できるが、環境によっては「ソースから解決できない」
# （reportMissingModuleSource）が誤検知される。デバッガではなく静的解析の設定。
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"

[tool.basedpyright]
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"
