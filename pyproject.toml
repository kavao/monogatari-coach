[project]
name = "monocri"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "types-PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pyright>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tools/tests", "tools/manga_prompt_ir/tests"]

[tool.pyright]
# PyYAML は実行時に問題なく import できるが、環境によっては「ソースから解決できない」
# （reportMissingModuleSource）が誤検知される。デバッガではなく静的解析の設定。
reportMissingModuleSource = false
include = ["tools"]
exclude = [
  "tools_temp",
  "_how_to",
  "tools/tests",
  "tools/manga_prompt_ir/tests",
]
venvPath = "."
venv = ".venv"

[tool.basedpyright]
reportMissingModuleSource = false
include = ["tools"]
exclude = [
  "tools_temp",
  "_how_to",
  "tools/tests",
  "tools/manga_prompt_ir/tests",
]
venvPath = "."
venv = ".venv"
