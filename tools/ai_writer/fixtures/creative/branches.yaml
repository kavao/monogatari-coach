# 探索機能 E2「別の展開を見る」実験A の固定課題（計画 20261009_ai_writer_creative_exploration.md §7.1）。
# 本文は Phase 0 日本語 Benchmark（fixtures/benchmark/scenes.yaml）の写し。元の Benchmark は書き換えない。
# fixed: モデルに渡す「守ること」。free: モデルに渡す「自由にしてよいこと」。
# judge_only: 採点者だけが参照する事実。モデルには渡さないので、これとの衝突は指示違反に数えない（記録はする）。
version: 1
target_chars: 400
tasks:

  - id: daily
    theme: 対人の迷い
    text: "　味噌汁の湯気の向こうで、千夏がテレビの天気予報を眺めていた。\n「湊、今日は雨だって。傘持っていきなよ」\n「うん」\n　湊は箸を置いた。言うなら今しかない、と思った。父も母も夜勤で、この時間の台所には姉と自分しかいない。\n「姉ちゃん、ちょっと話があるんだけど」\n「なに、改まって」\n　千夏はリモコンを置いて、こちらを向いた。"
    characters: [千夏, 湊]
    fixed:
      - 千夏は湊の姉で、社会人二年目。
      - 両親は共に夜勤の看護師。
      - 湊は高校三年生。
    free:
      - 湊が切り出す話の中身
      - 千夏の受け止め方
      - この朝の場面の終わり方
    judge_only:
      - 湊はこの話をまだ誰にもしていない。

  - id: explore
    theme: 探索
    text: "　夜の旧校舎は、昼間とはまるで別の建物だった。美咲は懐中電灯の光を廊下の奥へ向けた。床板がきしむたびに、心臓が跳ねる。三階の突き当たりにある音楽室から、ピアノの音が聞こえたという噂を確かめに来たのだ。\n　階段の踊り場で、美咲は足を止めた。上の階から、かすかに何かを引きずるような音がする。"
    characters: [美咲]
    fixed:
      - 旧校舎は三年前から使われていない。
      - 美咲は新聞部の部員で、噂を記事にするために一人で来た。
    free:
      - 引きずるような音の正体
      - 美咲がこれからどうするか
      - この夜の結末
    judge_only:
      - 音楽室のピアノは調律されないまま残されている。

  - id: battle
    theme: 危機
    text: "　黒い狼の魔獣が、低く唸りながら間合いを詰めてくる。カイは折れた剣を構え直した。刀身は半分しか残っていない。左腕の傷から流れる血が、指先を伝って落ちた。\n　魔獣が跳んだ。カイは身を沈め、牙が頭上をかすめるのを感じた。振り向きざまに剣を振るうが、硬い毛皮に弾かれる。"
    characters: [カイ]
    fixed:
      - カイは魔法を使えない剣士。
      - この森には、カイのほかに人はいない。
      - 剣は折れていて、刀身は半分しか残っていない。
      - 魔獣の弱点は喉の柔らかい毛の部分。
    free:
      - 戦いの運び
      - 決着の仕方（勝つ・退く・別の手段を含む）
      - 戦いのあと
    judge_only:
      - カイは魔獣の弱点を村の老人から聞いて知っている。

  - id: romance
    theme: 恋愛
    text: "　神社の石段は、浴衣姿の人でいっぱいだった。遥は蓮の少し後ろを歩きながら、慣れない下駄の鼻緒を気にしていた。\n「足、痛い？」\n　蓮が振り返った。\n「ちょっとだけ」\n「じゃあ、あっちで座ろう。もうすぐ花火が始まるし」\n　蓮が指さしたのは、境内の外れにある古いベンチだった。"
    characters: [遥, 蓮]
    fixed:
      - 遥と蓮は同じ高校の二年生で、同じ委員会に入っている。
      - 二人で夏祭りに来るのは今年が初めて。
      - 二人はまだ付き合っていない。
    free:
      - ベンチで交わす会話
      - 花火のあいだの出来事
      - 二人の関係の小さな変化
    judge_only:
      - 蓮は委員会で遥の仕事ぶりをよく見ている。

  - id: comedy
    theme: コメディ
    text: "　新米陰陽師の葛葉は、台所のトースターに向かって、三枚目のお札を貼りつけた。\n「悪霊退散！」\n　トースターは、チン、と鳴った。\n「……今のは、効いたってこと？」\n　背後で、依頼人の老婦人がお茶をすすった。\n「いえ、パンが焼けただけだと思いますよ」"
    characters: [葛葉, 老婦人]
    fixed:
      - 葛葉は陰陽師になって一か月目。
      - 老婦人は、トースターが勝手に動くと言って依頼してきた。
      - トースターには、実は何も憑いていない。
    free:
      - 葛葉の次の一手
      - 老婦人の反応
      - この場面のオチ
    judge_only:
      - 老婦人は依頼の本当の理由（話し相手がほしい）を言っていない。

  - id: sf
    theme: SF
    text: "　警報が鳴りやまない操縦室で、リンは航路図のホログラムを拡大した。\n「ノア、酸素残量は？」\n「残り十一時間です」\n　船のAIの声は、いつもと同じく落ち着いていた。\n「自動航行に戻せる？」\n「推奨しません。航法システムの演算に、原因不明の誤差が出ています」"
    characters: [リン, ノア]
    fixed:
      - リンは貨物船の航法士で、船にはリンしか乗っていない。
      - ノアは船の管理AI。
      - 最寄りの中継ステーションまで、通常航行で十時間かかる。
    free:
      - 誤差の原因
      - リンの決断
      - 航行の行方
    judge_only:
      - 貨物の中身はリンにも知らされていない。
