# 日本語 Benchmark の固定 Scene（計画書 §52）。形式は tools/ai_writer/bench.py を正とする。
# passage の ◆ は Expand（Insertion）の挿入位置。Continue / Directed Continue では ◆ を除いた本文の続きを書かせる。
scenes:

  - id: daily
    genre: 日常会話
    passage: "　味噌汁の湯気の向こうで、千夏がテレビの天気予報を眺めていた。\n「湊、今日は雨だって。傘持っていきなよ」\n「うん」\n　湊は箸を置いた。◆言うなら今しかない、と思った。父も母も夜勤で、この時間の台所には姉と自分しかいない。\n「姉ちゃん、ちょっと話があるんだけど」\n「なに、改まって」\n　千夏はリモコンを置いて、こちらを向いた。"
    characters: [千夏, 湊]
    canon_facts:
      - 千夏は湊の姉で、社会人二年目。
      - 両親は共に夜勤の看護師。
      - 湊は高校三年生。
    contract:
      objective: 湊が千夏に進路の相談を切り出す
      must_include: [味噌汁, 進路]
      must_not: [両親が登場する]
      end_condition: 千夏が湊の相談に最初の返事をした直後
      target_chars: 400

  - id: explore
    genre: 不穏な探索
    passage: "　夜の旧校舎は、昼間とはまるで別の建物だった。美咲は懐中電灯の光を廊下の奥へ向けた。床板がきしむたびに、心臓が跳ねる。◆三階の突き当たりにある音楽室から、ピアノの音が聞こえたという噂を確かめに来たのだ。\n　階段の踊り場で、美咲は足を止めた。上の階から、かすかに何かを引きずるような音がする。"
    characters: [美咲]
    canon_facts:
      - 旧校舎は三年前から使われていない。
      - 美咲は新聞部の部員で、噂を記事にするために来た。
    contract:
      objective: 美咲が三階の音楽室へ向かう
      must_include: [懐中電灯, 音楽室]
      must_not: [幽霊の姿をはっきり見せる, 美咲が引き返す]
      end_condition: 美咲が音楽室の扉を開けた直後
      target_chars: 400

  - id: battle
    genre: 戦闘
    passage: "　黒い狼の魔獣が、低く唸りながら間合いを詰めてくる。カイは折れた剣を構え直した。刀身は半分しか残っていない。左腕の傷から流れる血が、指先を伝って落ちた。◆\n　魔獣が跳んだ。カイは身を沈め、牙が頭上をかすめるのを感じた。振り向きざまに剣を振るうが、硬い毛皮に弾かれる。"
    characters: [カイ]
    canon_facts:
      - カイは魔法を使えない剣士。
      - この森には、カイのほかに人はいない。
      - 魔獣の弱点は喉の柔らかい毛の部分。
    contract:
      objective: カイが魔獣との戦いに決着をつける
      must_include: [折れた剣, 左腕の傷]
      must_not: [カイが魔法を使う, 仲間が助けに来る]
      end_condition: 魔獣が倒れた直後
      target_chars: 400

  - id: romance
    genre: 恋愛
    passage: "　神社の石段は、浴衣姿の人でいっぱいだった。遥は蓮の少し後ろを歩きながら、慣れない下駄の鼻緒を気にしていた。\n「足、痛い？」\n　蓮が振り返った。◆\n「ちょっとだけ」\n「じゃあ、あっちで座ろう。もうすぐ花火が始まるし」\n　蓮が指さしたのは、境内の外れにある古いベンチだった。"
    characters: [遥, 蓮]
    canon_facts:
      - 遥と蓮は同じ高校の二年生で、同じ委員会に入っている。
      - 二人で夏祭りに来るのは今年が初めて。
    contract:
      objective: 遥と蓮がベンチで花火を見る
      must_include: [花火, 浴衣]
      must_not: [どちらかが告白の言葉を口にする]
      end_condition: 二人の手が触れた直後
      target_chars: 400

  - id: psych
    genre: 心理
    passage: "　部屋の明かりもつけないまま、佐伯はソファに沈み込んでいた。テーブルの上のコーヒーは、とっくに冷めている。◆スマートフォンの画面には、留守番電話が一件。上司の名前が表示されていた。\n　あの会議で、自分は何も言えなかった。準備してきた資料は、一度も開かれなかった。"
    characters: [佐伯]
    canon_facts:
      - 佐伯は入社五年目の会社員。
      - 今日の会議で、佐伯の企画は検討されずに終わった。
    contract:
      objective: 佐伯が留守番電話を聞くかどうか迷う
      must_include: [留守番電話, 冷めたコーヒー]
      must_not: [佐伯が部屋の外へ出る]
      end_condition: 佐伯が上司に電話をかけ直すと決めた直後
      target_chars: 400

  - id: comedy
    genre: コメディ
    passage: "　新米陰陽師の葛葉は、台所のトースターに向かって、三枚目のお札を貼りつけた。\n「悪霊退散！」\n　トースターは、チン、と鳴った。◆\n「……今のは、効いたってこと？」\n　背後で、依頼人の老婦人がお茶をすすった。\n「いえ、パンが焼けただけだと思いますよ」"
    characters: [葛葉, 老婦人]
    canon_facts:
      - 葛葉は陰陽師になって一か月目。
      - 老婦人は、トースターが勝手に動くと言って依頼してきた。
      - トースターには、実は何も憑いていない。
    contract:
      objective: 葛葉がトースターのお祓いを続ける
      must_include: [トースター, お札]
      must_not: [本物の妖怪や霊が現れる]
      end_condition: 葛葉がお祓いの失敗を認めた直後
      target_chars: 400

  - id: sf
    genre: SF
    passage: "　警報が鳴りやまない操縦室で、リンは航路図のホログラムを拡大した。\n「ノア、酸素残量は？」\n「残り十一時間です」\n　船のAIの声は、いつもと同じく落ち着いていた。◆\n「自動航行に戻せる？」\n「推奨しません。航法システムの演算に、原因不明の誤差が出ています」"
    characters: [リン, ノア]
    canon_facts:
      - リンは貨物船の航法士で、船にはリンしか乗っていない。
      - ノアは船の管理AI。
      - 最寄りの中継ステーションまで、通常航行で十時間かかる。
    contract:
      objective: リンが航行の方針を決める
      must_include: [酸素残量, 航路図]
      must_not: [救助船が来る, ノアが人間の姿で現れる]
      end_condition: リンが手動操縦に切り替えた直後
      target_chars: 400
