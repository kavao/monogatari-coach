# Capability Profile（計画書 §3）。verified: true は Phase 0 Spike の実測、false は推測。
# 実測の証跡: _workingspace/ai_writer/phase0/20261008_215516/（契約）、20261008_225937/（生成）、20261008_232155/（usage・文脈長・同時実行）、phase0_expand/20261008_233925/（Expand 方式）
id: novelai-xialong-v1
provider: novelai
model: xialong-v1
family: xialong
revision: 6
requires_tier: opus  # 非公式情報。tier 3 の契約で 200 を確認

endpoints:
  chat: https://text.novelai.net/oa/v1/chat/completions
  completions: https://text.novelai.net/oa/v1/completions

capabilities:

  completion:
    supported: true
    verified: true
    source: spike completions（200、文の途中から続く）
    verified_at: 2026-10-08
    notes: Markdown の太字（**…**）が混ざることがある。指示なしでは新しい人物（「美沙子」）を足した。Guard の対象

  instruction:
    supported: true
    syntax: chat_messages
    verified: true
    source: spike chat-stream
    verified_at: 2026-10-08

  system_prompt:
    supported: true
    verified: true
    source: spike system-role（200）
    verified_at: 2026-10-08
    notes: 指示の字数を超えて書き続け、「***」で場面を切り替えて別の話を始めた（max_tokens で打ち切り）

  assistant_prefill:
    supported: true
    verified: true
    source: spike assistant-prefill（本文を繰り返さずに続ける）
    verified_at: 2026-10-08

  streaming:
    supported: true
    verified: true
    source: spike chat-stream（OpenAI 互換 SSE、choices[0].delta.content、[DONE] 行で終わる）
    verified_at: 2026-10-08

  non_streaming:
    supported: false
    verified: true
    source: spike chat-nonstream
    verified_at: 2026-10-08
    notes: 200 だが choices[0].text が空で token_ids だけ返る。usage は返る。本文取得はストリームを使う

  cancel:
    supported: true
    method: close_stream
    verified: true
    source: spike cancel（40字で接続を閉じ、部分出力を保持）
    verified_at: 2026-10-08

  stop_sequences:
    supported: true
    verified: true
    source: spike stop（「。」の直前で止まる。停止文字は出力に含まれない）
    verified_at: 2026-10-08

  sampling:
    accepted: [temperature, top_p, top_k, min_p, frequency_penalty, presence_penalty]
    verified: true
    source: spike extra-sampling（200。効き目は未測定）
    verified_at: 2026-10-08

  token_count:
    supported: true
    method: stream_token_ids
    verified: true
    source: spike stream-usage-*（stream_options.include_usage は無視され usage は null）。各チャンクの choices[0].token_ids を数えれば出力トークン数になる。非ストリームでは usage.prompt_tokens / completion_tokens が返る
    verified_at: 2026-10-08
    chars_per_token_output:
      p10: 1.134
      median: 1.244
      p90: 1.395
      samples: 63
      source: phase0_bench/20261009_010339（7 Scene × 3 操作 × 3 回。整形前の字数 ÷ token_ids 数）。全体は p10 1.109 / median 1.223 / p90 1.35（126 件）
    chars_per_token_input:
      value: 1.21
      notes: 段落番号付きの繰り返し文（context-8k / 28k）。本番の本文では変わりうる

  max_output:
    observed_chars: 1814
    verified: true
    source: spike long-output（max_tokens 1500、finish_reason stop。上限には達していない。28秒で GLM-4.6 の約半分）
    verified_at: 2026-10-08

  context_limit:
    tokens: 36864
    counts: prompt_tokens + max_tokens
    verified: true
    source: spike context-28k（入力 27,690 で 200）、context-40k（400「too much context. got 39287 + 16, max is 36864」）。公表の 28,672 + rollover 8,192 と一致。契約情報の perks.contextTokens 8192 は使わない
    verified_at: 2026-10-08

  rate_limit:
    concurrency: 1
    verified: true
    source: spike parallel-3（3本同時で 1本が 200、2本が 429「Concurrent generation is locked」）。x-ratelimit 系ヘッダはなし。直列で送る
    verified_at: 2026-10-08

  expand_modes:
    insertion:
      supported: true
      preferred: true
      method: chat_with_marker
      postprocess: first_paragraph_only
      verified: true
      source: expand spike insertion-chat（本文の 1 文は良好。8 か所中 4 か所で後ろに区切り・自己採点・解説を続けるため、最初の段落だけ採る）。completions 方式は新しい事実が多い（「廃線」「大学」「十数年前」）
      verified_at: 2026-10-08
    rewrite:
      supported: true
      preferred: false
      recommended: false
      verified: true
      source: expand spike rewrite-chat（台詞を書き換え 1/2、新しい出来事と事実を足す、1/2 で「***」のあとにチャットログを 944字続けた）
      verified_at: 2026-10-08

# 定性的な傾向の検証（2026-10-09、Benchmark 126 件・照合後の確定点）: 「数値や契約より場面を膨らませる方へ寄る」は支持
# （Directed Continue の終了条件超過 17/21、遵守の差は 14 条件中マイナス 11）。「結果として魅力が高い」は支持されない
# （魅力の差は 21 条件中プラス 2・同点 4・マイナス 15）。出典: _workingspace/ai_writer/phase0_bench/20261009_010339/findings.md
# Phase 0 の結論で既定にしない（2026-10-09）。使う場合は終了条件の検査と後ろの余計な文章の切り落としが前提
preferred_operations: []
