        w: 0.56
        h: 0.28
    - panel_id: 5
      rect:
        x: 0.04
        y: 0.69
        w: 0.33
        h: 0.28
color_palette:
  mode: full_color
  colors:
    - pale morning blue
    - warm sunlight yellow
technical:
  resolution: 2k
  quality_level: high
  negative_tags:
    - bad anatomy
    - text
