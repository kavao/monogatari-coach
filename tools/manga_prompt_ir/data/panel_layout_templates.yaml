schema_version: "1.0"
description: >-
  漫画ページのコマ割りの型。manga.layout_template_id から参照し、tools/novel_manga_layout_apply.py が
  layout_geometry を起こすときに使う。slots は読み順（右上から左下。同じ段は右が先）に並ぶ。
  panels[] の k 番目のコマは slots の k 番目に入る（読み順は入れ替えない）。
  座標は正規化 0〜1・左上原点。余白 0.04（左右）/ 0.03（上下）、コマ間 0.03。
  weight は抽選の重み（均等割りに近い型は低め）。suits は向く拍子（beat_type_vocab.yaml の id）。
  panel_layout_ja / layout_ja / layout_en は、型を当てたときに manga.panel_layout と各コマの composition.layout / layout_en へ書く文章（座標から機械生成。大ゴマ／中ゴマ／小コマは型の中で最大の枠に対する面積比 0.75 / 0.45 で決める）。
  size_class は面積から機械的に付けた目安（0.70 以上 splash / 0.30 large / 0.16 medium / 0.07 small / それ未満 inset）。
  座標は自前設計（行・列の再帰分割から生成）。外部データセットの座標は写していない。

templates:
- template_id: p1_full
  label_ja: 1コマ・ページ全面（余白あり）
  panel_layout_ja: 日本の漫画のコマ割り、1コマ・ページ全面（余白あり）（1コマ）。右から左。
  panel_count: 1
  weight: 1.0
  suits:
  - climax
  - showcase
  - establishing
  gutter: 0.03
  bleed: false
  slots:
  - rect:
      x: 0.04
      y: 0.03
      w: 0.92
      h: 0.94
    size_class: splash
    layout_ja: ページ全面の1コマ
    layout_en: full-page panel
