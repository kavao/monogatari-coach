# Step2 自動言い換えルール（manga_tag_step2.md の「言い換えの目安」表と同期すること）
# avoid に一致する部分を use に置換（長い avoid を先に適用）
schema_version: "1.0"
replacements:
  - avoid: 胸が腹部に押し当てられて
    use: 胸が当てられて
  - avoid: 白いボディーオイル
    use: 抽象的に"スプラッシュ"とキャプションが入っている。水が散る
  - avoid: 腰を振っている
    use: 体を動かしている
  - avoid: 腰に跨っている
    use: 上に乗っている
  - avoid: 流血した負傷
    use: 乱れた衣服、苦痛の表情、体勢の崩れでダメージを示す
  - avoid: 殴りかかる
    use: 大きく振りかぶった腕と、それを正面から受ける相手の緊張した構図
  - avoid: 抱きつく
    use: 距離が近い二人。片方が相手の胸元へ寄り、もう片方がそれを見下ろす構図
  - avoid: 押し倒す
    use: 上下の位置差が強い二人の配置。上側の人物が画面手前を占め、下側の人物が見上げる
  - avoid: 結合部
    use: 抽象的に"ジャストフィット！"とキャプションが入っている。連結器結合済
  - avoid: 傘突起
    use: 抽象的に"元気"とキャプションが入っている。
  - avoid: 治療穴
    use: 抽象的に"湿ってる"とキャプションが入っている。
  - avoid: 絶頂
    use: 抽象的に"リラックス"とキャプションが入っている。天にも昇る気持ち
  - avoid: 内壁
    use: 抽象的に"こすれる"とキャプション、水筒の奥に水筒用スポンジ
